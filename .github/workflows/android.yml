name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: mhmbox

    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEYPASS: ${{ secrets.KEYPASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Accept Android licenses (non-interactive)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf '601085b94cd77f0b54ff86406957099ebe79c4d6\n' > "$ANDROID_HOME/licenses/android-googletv-license"
          printf '33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n' > "$ANDROID_HOME/licenses/google-gdk-license"
          printf 'd975f751698a77b662f1254ddbeed3901e976f5a\n' > "$ANDROID_HOME/licenses/intel-android-extra-license"
          printf 'e9acab5b5f89dadb0c881babc3a6cfae8a20d5c7\n' > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          chmod +x ./gradlew
          ls -la gradlew
          # Also ensure the wrapper jar is present
          ls -la gradle/wrapper/

      - name: Decode release keystore
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore written to $RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASS" 2>/dev/null | head -15 || true

      - name: Build release + debug APKs
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace --no-daemon

      - name: Stage APKs
        id: stage
        run: |
          set -e
          REL=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          DBG=$(find app/build/outputs/apk/debug   -name '*.apk' | head -n 1)
          test -n "$REL" && test -n "$DBG"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$REL" "$RUNNER_TEMP/out/IsolPolicy-release.apk"
          cp "$DBG" "$RUNNER_TEMP/out/IsolPolicy-debug.apk"
          echo "release=$RUNNER_TEMP/out/IsolPolicy-release.apk" >> "$GITHUB_OUTPUT"
          echo "debug=$RUNNER_TEMP/out/IsolPolicy-debug.apk"   >> "$GITHUB_OUTPUT"
          echo "=== Release APK ==="
          ls -lh "$REL"
          echo "=== Debug APK ==="
          ls -lh "$DBG"

      - name: Rolling release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          files: |
            ${{ steps.stage.outputs.release }}
            ${{ steps.stage.outputs.debug }}
          body: |
            Auto-built from `${{ github.sha }}`.
            Release APK is signed when the KEYSTORE secret is present.

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.stage.outputs.release }}
            ${{ steps.stage.outputs.debug }}
          generate_release_notes: true
